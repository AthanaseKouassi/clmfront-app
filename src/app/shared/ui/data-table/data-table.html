
<div class="mat-elevation-z8 table-wrapper">
  <table mat-table [dataSource]="dataSource" matSort class="mat-table-custom">

    <!-- Colonnes dynamiques -->
    @for (column of columns; track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef class="header-cell">
          {{ column.header }}
        </th>
        <td mat-cell *matCellDef="let element" class="body-cell">
          {{ element[column.key] | formatCell: column }}
        </td>
      </ng-container>
    }

    <!-- Colonne actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef style="width: 150px;" class="header-cell center">Actions</th>
      <td mat-cell *matCellDef="let member" class="body-cell center action-cell">
        <button mat-icon-button style="color: green"  (click)="detail.emit(member)" matTooltip="Détails">
          <mat-icon>description</mat-icon>
        </button>
        <button mat-icon-button style="color: darkblue"  (click)="edit.emit(member)" matTooltip="Modifier">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button style="color:darkred" (click)="delete.emit(member)" matTooltip="Supprimer">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="mat-header-row-custom"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      (click)="rowClick.emit(row)"
      class="clickable-row"
    ></tr>
  </table>

  <mat-paginator
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    (page)="pageChange.emit($event)"
    showFirstLastButtons
  ></mat-paginator>
</div>
